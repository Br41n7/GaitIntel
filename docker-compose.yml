services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gait_user
      POSTGRES_PASSWORD: gait_pass
      POSTGRES_DB: gait_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://gait_user:gait_pass@db:5432/gait_intelligence
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
      - video_storage:/app/storage
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  video_storage:
